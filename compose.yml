name: asistente-movilidad

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: asistente-movilidad-bd
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"   # solo accesible desde este equipo
    volumes:
      - datos_bd:/var/lib/postgresql/data

volumes:
  datos_bd:
