# Nginx delante del asistente: HTTPS + clave de acceso.
server_tokens off;

# HTTP -> HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/servidor.crt;
    ssl_certificate_key /etc/nginx/certs/servidor.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # Con un certificado institucional (no autofirmado) se puede activar:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;

    # Clave de acceso (usuarios en certs/usuarios)
    auth_basic "Asistente de Movilidad Internacional";
    auth_basic_user_file /etc/nginx/certs/usuarios;

    # Aplicativo de carga: https://SERVIDOR/carga/
    # Usa los mismos usuarios del asistente (certs/usuarios): cualquiera de la oficina puede subir archivos.
    location = /carga {
        return 301 /carga/;
    }
    location /carga/ {
        client_max_body_size 30m;
        proxy_request_buffering off;
        proxy_pass http://carga:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # El modelo local puede tardar varios minutos en responder
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
